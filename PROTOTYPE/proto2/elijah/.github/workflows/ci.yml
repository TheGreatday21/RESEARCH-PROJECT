name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy src/elijah
      - name: Validate Compose without starting services
        run: docker compose -f lab/docker-compose.yml config --quiet
      - name: Run unit tests
        run: pytest tests/unit -q
