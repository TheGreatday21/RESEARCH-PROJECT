user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 10;

    log_format elijah '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'request_time=$request_time request_id=$request_id connection=$connection';
    access_log /var/log/nginx/access.log elijah;
    error_log /var/log/nginx/error.log notice;

    server {
        listen 80;
        server_name _;
        root /var/www/elijah;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /login {
            return 204;
        }

        location /upstream/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
        }
    }
}
