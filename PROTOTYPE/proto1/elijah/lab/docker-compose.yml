name: elijah-lab

services:
  target:
    build:
      context: ./target
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "sshd -t && nginx -t"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [lab]

  traffic:
    image: python:3.11-slim
    working_dir: /app
    command: ["python", "generate.py", "--output", "/app/output/labels.jsonl"]
    volumes:
      - ./traffic:/app
    depends_on:
      target:
        condition: service_healthy
    networks: [lab]

networks:
  lab:
    driver: bridge
