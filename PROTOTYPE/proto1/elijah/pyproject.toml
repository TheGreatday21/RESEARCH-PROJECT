[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elijah"
version = "0.1.0"
description = "On-demand nginx log acquisition with signed provenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ansible-core>=2.19.15,<2.20",
  "cryptography>=42,<47",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
elijah = "elijah.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elijah = ["acquire/ansible/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the local Docker lab and explicit opt-in",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/elijah/acquire/collector.py" = ["UP006", "UP017", "UP035", "UP045"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["elijah"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ansible.*", "yaml.*"]
ignore_missing_imports = true
