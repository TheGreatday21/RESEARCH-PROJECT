[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapa"
version = "0.3.0"
description = "Four-phase nginx forensic log acquisition, parsing, analysis, and attack detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ansible-core>=2.19.15,<2.20",
  "cryptography>=42,<47",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "pyarrow==26.0.1",
  "duckdb==1.5.6",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
lapa = "cli.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "common*",
  "phase1_acquire*",
  "phase2_parse*",
  "phase3_analyze*",
  "phase4_detect*",
  "cli*",
  "gui*",
  "lab*",
]

[tool.setuptools.package-data]
phase1_acquire = ["ansible/**/*"]

[tool.pytest.ini_options]
testpaths = [
  "common/tests",
  "phase1_acquire/tests",
  "phase2_parse/tests",
  "phase3_analyze/tests",
  "phase4_detect/tests",
  "cli/tests",
  "gui/tests",
  "lab/tests",
]
addopts = "-m 'not integration'"
markers = [
  "integration: requires the local Docker lab and explicit opt-in",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"phase1_acquire/collector.py" = ["UP006", "UP017", "UP035", "UP045"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["common", "phase1_acquire", "phase2_parse", "phase3_analyze", "phase4_detect", "cli", "gui"]

[[tool.mypy.overrides]]
module = ["ansible.*", "yaml.*", "pyarrow.*"]
ignore_missing_imports = true
